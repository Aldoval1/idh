<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        .login-form {
            margin-top: 30px;
        }
        input[type="password"] {
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>Hi professor Guyton, if you see this page it means I'm trying to make some little adjustments, will be shortly solved!</p>

        <div class="login-form">
            <input type="password" id="password" placeholder="Enter password">
            <button onclick="checkPassword()">Enter</button>
            <p id="error-msg" style="color: red; display: none;">Incorrect password.</p>
        </div>
    </div>

    <script>
        function checkPassword() {
            var pwd = document.getElementById("password").value;
            if (pwd === "idhspring") {
                window.location.href = "index_real.html";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        document.getElementById("password").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                checkPassword();
            }
        });
    </script>
</body>
</html>
